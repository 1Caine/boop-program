[package]
name = "boop-program"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "boop_program"

[features]
default = ["no-log-ix-name"]
cpi = ["no-entrypoint"]
devnet = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token"] }
